<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automated Vacuum Cleaner</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-container">
      <!-- Top Right: WiFi and Battery Indicator -->

      <div class="top-right" id="top-right">
        <ul>
          <li>
            <a href="#" class="wifi_parent"
              ><i class="fa fa-wifi wifi" aria-hidden="true"></i
            ></a>
          </li>
        </ul>

        <div class="battery-indicator">
          <div id="batBody">
            <div id="indicator"></div>
          </div>
          <div class="batEnd"></div>
          <div class="battery_number">
            <p>100%</p>
          </div>
        </div>
      </div>

      <!-- Bottom Left: Directional Control -->
      <div class="bottom-left">
        <!-- Control Buttons -->
        <div class="controls">
          <div class="directional-buttons">
            <button class="direction-button up">
              <span class="visually-hidden">up</span>
            </button>
            <button class="direction-button left">
              <span class="visually-hidden">left</span>
            </button>
            <button class="direction-button right">
              <span class="visually-hidden">right</span>
            </button>
            <button class="direction-button down">
              <span class="visually-hidden">down</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Middle Section -->
      <div class="middle-section">
        <!-- Upper Section: Distance Indicator -->
        <div class="distance-indicator">
          <!-- <div class="bars">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>

            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </div> -->
          <div class="precision_section">
            <div class="direction_distances">
              <div class="black">
                <div class="dir">
                  <div>
                    <i class="fa-solid fa-arrow-up"></i>
                  </div>
                  <p>1929</p>
                </div>
                <div class="dir">
                  <div><i class="fa-solid fa-arrow-down"></i></div>
                  <p>1001</p>
                </div>
                <div class="dir">
                  <div>
                    <i class="fa-solid fa-arrow-left"></i>
                  </div>
                  <p>20020</p>
                </div>
                <div class="dir">
                  <div>
                    <i class="fa-solid fa-arrow-right"></i>
                  </div>
                  <p>3030</p>
                </div>
              </div>
            </div>
            <div class="radar_radar"></div>
            <div class="distance_to_travel">
              <div class="input-group max">
                <label for="gridHeight">Max(x)</label>
                <input
                  type="number"
                  id="gridHeight"
                  value="10"
                  min="1"
                  max="50"
                />
              </div>

              <div class="input-group max">
                <label for="gridHeight">Max(y)</label>
                <input
                  type="number"
                  id="gridHeight"
                  value="10"
                  min="1"
                  max="50"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- Lower Section: Grid Container -->
        <div class="grid-section">
          <!-- Grid -->
          <!-- <canvas id="pathGrid"></canvas> -->
          <!-- Height and Width Bars -->
          <!-- <div class="height-bar"></div>
          <div class="width-bar"></div> -->

          <div class="controls">
            <div class="dimension-controls">
              <div class="input-group">
                <label for="gridWidth">Width:</label>
                <input
                  type="number"
                  id="gridWidth"
                  value="10"
                  min="1"
                  max="50"
                />
              </div>
              <div class="input-group">
                <label for="gridHeight">Height:</label>
                <input
                  type="number"
                  id="gridHeight"
                  value="10"
                  min="1"
                  max="50"
                />
              </div>
              <button onclick="updateGrid()">
                <i class="fa-solid fa-paper-plane"></i>
              </button>
            </div>
          </div>

          <canvas id="gridCanvas"></canvas>
          <div class="timer-bar">
            <div class="timer-progress"></div>
          </div>
          <div class="status"></div>
          <div id="coordinates"></div>
        </div>
      </div>

      <!-- Speed Controllers -->
      <div class="speed-section">
        <div class="speed-name">
          <p>Speed</p>
        </div>

        <div class="speed-row">
          <div class="speed-controller m">
            <div class="motor">
              <p>Motor</p>
            </div>
            <div class="progress one"></div>
            <div class="control_m">
              <button class="leftt">
                <i class="fa-solid fa-arrow-left"></i>
              </button>
              <button class="rightt">
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </div>
          </div>
          <div class="speed-controller v">
            <div class="vaccum">
              <p>vaccum</p>
            </div>
            <div class="progress two"></div>

            <div class="control_v">
              <button class="leftt">
                <i class="fa-solid fa-arrow-left"></i>
              </button>
              <button class="rightt">
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Monitoring Section -->
      <div class="monitoring-section">
        <div class="monitor temperature">
          <div id="termometer">
            <div id="temperature" data-value="0°C"></div>
            <div id="graduations"></div>
          </div>
        </div>
        <div class="monitor tank">
          <div
            class="progress progress-bar-vertical mx-auto d-flex align-items-end position-relative rounded-pill"
          >
            <div
              id="X"
              class="progress-bar position-absolute rounded-pill red"
              role="progressbar"
              aria-valuenow="50"
              aria-valuemin="0"
              aria-valuemax="100"
            ></div>
          </div>
          <div class="tank_button">
            <a href="#" class="tank_parent">
              <i class="fa fa-prescription-bottle" aria-hidden="true"></i
            ></a>
            <div id="tank" data-value="0%"></div>
            <div id="arrow"></div>
          </div>
        </div>
      </div>

      <!-- Bottom Right: Mode Buttons -->
      <div class="mode-buttons">
        <button id="automatedMode">
          <i class="fa fa-robot" aria-hidden="true"></i>
        </button>
        <button id="specialMode">
          <i class="fa fa-pencil" aria-hidden="true"></i>
        </button>
        <button id="manualMode">
          <i class="fa fa-gamepad" aria-hidden="true"></i>
        </button>

        <button id="ultrasonicMode">
          <i class="fa-brands fa-audible"></i>
        </button>
      </div>
    </div>

    <!-- <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js"></script> -->
    <script src="script.js"></script>
  </body>
</html>
